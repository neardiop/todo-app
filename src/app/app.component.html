<mat-sidenav-container class="app-container">
  <mat-sidenav mode="side" opened class="sidebar">
    <div class="sidebar-header">
      <h2>Task Manager</h2>
    </div>
    <mat-nav-list>
      <a mat-list-item routerLink="/todos" routerLinkActive="active">
        <mat-icon>list</mat-icon>
        <span>Tâches</span>
      </a>
      <a mat-list-item routerLink="/persons" routerLinkActive="active">
        <mat-icon>people</mat-icon>
        <span>Personnes</span>
      </a>
    </mat-nav-list>
    
    <div class="sidebar-section">
      <h3>Labels</h3>
      <mat-nav-list>
        <a mat-list-item>
          <mat-icon class="label-icon html">label</mat-icon>
          <span>HTML</span>
        </a>
        <a mat-list-item>
          <mat-icon class="label-icon css">label</mat-icon>
          <span>CSS</span>
        </a>
        <a mat-list-item>
          <mat-icon class="label-icon jquery">label</mat-icon>
          <span>jQuery</span>
        </a>
        <a mat-list-item>
          <mat-icon class="label-icon nodejs">label</mat-icon>
          <span>Node.js</span>
        </a>
      </mat-nav-list>
    </div>
  </mat-sidenav>
  
  <mat-sidenav-content class="main-content">
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
