<div class="modal-overlay" (click)="onClose()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <h2>{{ person ? 'Éditer' : 'Ajouter' }} une personne</h2>
    
    <form [formGroup]="personForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Nom *</label>
        <input type="text" formControlName="name" />
        <span class="error" *ngIf="personForm.get('name')?.invalid && personForm.get('name')?.touched">
          Le nom doit contenir au moins 3 caractères
        </span>
      </div>

      <div class="form-group">
        <label>Email *</label>
        <input type="email" formControlName="email" />
        <span class="error" *ngIf="personForm.get('email')?.invalid && personForm.get('email')?.touched">
          Email invalide
        </span>
      </div>

      <div class="form-group">
        <label>Téléphone *</label>
        <input type="tel" formControlName="phone" />
        <span class="error" *ngIf="personForm.get('phone')?.invalid && personForm.get('phone')?.touched">
          Le téléphone doit contenir 10 chiffres
        </span>
      </div>

      <div class="error" *ngIf="errorMessage">{{ errorMessage }}</div>

      <div class="modal-actions">
        <button type="button" (click)="onClose()" class="btn-cancel">Annuler</button>
        <button type="submit" class="btn-save">Enregistrer</button>
      </div>
    </form>
  </div>
</div>
